# 스타터 자체의 CI.
#
# 이 저장소의 게이트 스크립트는 "검사를 안 한 것을 통과로 보고하지 않는다" 가 존재 이유다.
# 그런데 그 스크립트가 거짓 통과를 내면 아무도 모른다 — 그래서 스크립트를 테스트한다.
#
# 이 파일과 tests/ 는 스타터를 프로젝트에 복사할 때 따라가지 않는다 (README "복사" 절의
# 목록에 없다). 프로젝트의 CI 는 프로젝트가 따로 정한다.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: 스크립트 테스트 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 스크립트는 표준 라이브러리만 쓴다. 지원 하한과 최신을 함께 본다.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 단위 테스트
        run: python -m unittest discover -s tests -v

  self-check:
    name: 스타터 자체 점검
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 스타터가 스스로 정한 규칙을 지키는지. 템플릿 상태에서는 전부 통과해야 한다.
      - name: 산출물 경로 규약
        run: python scripts/hooks/check_artifact_paths.py --all

      - name: 비밀정보
        run: python scripts/hooks/check_secrets.py --all

      - name: 절대경로 심볼릭 링크
        run: python scripts/hooks/check_symlinks.py --all

      - name: tasks.json 검증
        run: python scripts/validate_tasks.py

      - name: 아키텍처 제약
        run: python scripts/check_architecture.py

      - name: memory-bank 인덱스 최신 여부
        run: python scripts/rebuild_memory_bank_index.py --check

      - name: 문서 인덱스 최신 여부
        run: python scripts/rebuild_doc_index.py --check
