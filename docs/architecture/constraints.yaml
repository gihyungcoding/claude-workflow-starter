# 제약 — 기계가 검사하는 규칙만 여기 쓴다. (아키텍처 + 디자인)
#
# scripts/check_architecture.py 가 이 파일을 읽어 Phase 4(검증)에서 위반을 찾는다.
#
# ★ 이 파일의 유일한 규칙: 검사할 수 없는 것을 쓰지 않는다.
#   "서비스는 응집도가 높아야 한다" 같은 것은 architecture.md 에 쓴다.
#   여기 쓰면 검사되지 않으면서 검사되는 것처럼 보인다.
#
# detect.type
#   forbidden_import   paths 의 파일에서 pattern 이 발견되면 위반 (import 문 용)
#   forbidden_pattern  같은 동작. import 가 아닌 것(색상 리터럴, 매직 치수)에 쓴다
#   forbidden_path     paths 에 해당하는 파일이 존재하면 위반
#   required_path      paths 에 해당하는 파일이 하나도 없으면 위반
#
# severity
#   error   Phase 4 가 status: FAIL 로 판정한다 (다음 Phase 진입 불가)
#   warn    경고만 남기고 진행한다
#
# paths 는 glob 이다 (** 지원). pattern 은 파이썬 정규식이며 줄 단위로 매칭한다.
# exclude_paths 로 정본 파일을 뺀다 — 디자인 토큰 파일은 색상 리터럴로 가득한 것이
# 정상이므로, 그것을 위반으로 세면 규칙 자체가 성립하지 않는다.
#
# ★ 검사 대상이 0개인 제약은 '통과'가 아니다.
#   check_architecture.py 가 '?' 와 no_target 으로 구분해 보고한다. glob 을 먼저 고친다.

version: 1

constraints: []

